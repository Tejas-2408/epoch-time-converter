<!-- Allowing users to toggle the extension and switch timezones-->

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; font-family: system-ui, sans-serif; padding: 10px; margin: 0; }
    .row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
    label { font-size: 13px; font-weight: 500; }
    select { padding: 4px; width: 100%; border-radius: 4px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h3>Epoch Customizer</h3>
  <div class="row">
    <label for="status">Enable Converter</label>
    <input type="checkbox" id="status" checked>
  </div>
  <div class="row" style="flex-direction: column; align-items: flex-start;">
    <label for="timezone" style="margin-bottom: 5px;">Target Timezone</label>
    <select id="timezone">
      <option value="LOCAL">Local Time (Browser Default)</option>
      <option value="UTC">UTC / GMT</option>
      <option value="America/New_York">New York (EST/EDT)</option>
      <option value="Europe/London">London (GMT/BST)</option>
      <option value="Asia/Kolkata">India (IST)</option>
    </select>
  </div>
  <script src="popup.js"></script>
</body>
</html>
